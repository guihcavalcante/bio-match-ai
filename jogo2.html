<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio-Match: O Duelo dos Reinos Ocultos</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { background-color: #0b0f19; }
        .glow-green { text-shadow: 0 0 10px rgba(16, 185, 129, 0.6); }
        .glow-red { text-shadow: 0 0 15px rgba(239, 68, 68, 0.8); animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    </style>
</head>
<body class="text-gray-100 min-h-screen flex flex-col font-sans">

    <header class="bg-gray-900 border-b border-emerald-900/50 p-4 shadow-xl">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <h1 class="text-2xl font-black tracking-wider text-emerald-400 glow-green">🧪 BIO-MATCH</h1>
            <nav class="flex gap-2">
                <button onclick="switchTab('tab-jogo')" id="btn-tab-jogo" class="nav-btn bg-emerald-600 text-white font-semibold px-4 py-2 rounded-lg shadow-md shadow-emerald-900/30">🎮 Painel do Jogo</button>
                <button onclick="switchTab('tab-equipes')" id="btn-tab-equipes" class="nav-btn bg-gray-800 text-gray-300 font-semibold px-4 py-2 rounded-lg">👥 Equipes</button>
                <button onclick="switchTab('tab-questoes')" id="btn-tab-questoes" class="nav-btn bg-gray-800 text-gray-300 font-semibold px-4 py-2 rounded-lg">📚 Coleções & Questões</button>
            </nav>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6">
        <section id="tab-jogo" class="tab-content space-y-6">
            <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
                <div class="lg:col-span-1 bg-gray-900/80 border border-gray-800 rounded-2xl p-4 shadow-lg">
                    <h2 class="text-lg font-bold text-emerald-400 mb-4 flex items-center gap-2">🏆 Placar das Equipes</h2>
                    <div id="game-scoreboard" class="space-y-3"></div>
                </div>

                <div class="lg:col-span-3 flex flex-col justify-between bg-gray-900 border border-emerald-900/30 rounded-2xl p-6 shadow-xl min-h-[450px]">
                    
                    <div id="game-setup-screen" class="space-y-6 py-12 text-center max-w-md mx-auto">
                        <div class="text-5xl">🧬</div>
                        <h3 class="text-2xl font-bold">Iniciar Nova Rodada</h3>
                        <div>
                            <select id="game-collection-select" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white focus:outline-none"></select>
                        </div>
                        <button onclick="startGame()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-lg shadow-lg">Iniciar Seleção</button>
                    </div>

                    <div id="game-arena-screen" class="hidden space-y-4 h-full flex flex-col justify-between flex-1">
                        <div class="flex justify-between items-center border-b border-gray-800 pb-3">
                            <span id="game-active-collection-tag" class="bg-emerald-950 text-emerald-400 border border-emerald-800 text-xs px-3 py-1 rounded-full font-mono font-bold">Coleção</span>
                            
                            <div class="flex items-center gap-2 bg-gray-950 px-4 py-1 rounded-full border border-gray-800">
                                <span class="text-xs text-gray-500 uppercase font-mono font-bold">Tempo:</span>
                                <span id="game-timer" class="text-xl font-mono font-black text-emerald-400">30s</span>
                            </div>

                            <span id="game-questions-counter" class="text-sm font-mono text-gray-400">Restam: 0</span>
                        </div>

                        <div class="my-auto py-2">
                            <h3 id="game-question-text" class="text-xl md:text-2xl font-semibold text-white leading-relaxed">Carregando...</h3>
                        </div>

                        <div class="grid grid-cols-1 gap-3" id="game-options-container"></div>

                        <div class="border-t border-gray-800 pt-4 mt-4 flex flex-col sm:flex-row justify-between items-center gap-4">
                            <div class="flex gap-2 w-full sm:w-auto">
                                <button onclick="startCountdown()" id="btn-timer" class="bg-amber-600 hover:bg-amber-500 text-white text-sm font-bold px-4 py-2.5 rounded-lg transition-all">⏱️ Disparar 30s</button>
                                <button onclick="revealAnswer()" id="btn-reveal" class="bg-blue-600 hover:bg-blue-500 text-white text-sm font-bold px-4 py-2.5 rounded-lg transition-all">👁️ Revelar</button>
                                <button onclick="drawQuestion()" id="btn-next-question" class="bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-bold px-4 py-2.5 rounded-lg transition-all">🎲 Próxima</button>
                            </div>
                            <button onclick="stopGame()" class="text-xs text-gray-500 hover:text-red-400 underline">Encerrar Rodada</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section id="tab-equipes" class="tab-content hidden max-w-2xl mx-auto bg-gray-900 border border-gray-800 rounded-2xl p-6 shadow-xl">
            <h2 class="text-xl font-bold text-emerald-400 mb-2">👥 Gerenciar Equipes Participantes</h2>
            <form id="form-add-team" onsubmit="addTeam(event)" class="flex gap-2 mb-6">
                <input type="text" id="team-name-input" placeholder="Nome da Equipe..." required class="flex-1 bg-gray-800 border border-gray-700 rounded-lg px-4 py-2 text-white focus:outline-none">
                <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-6 py-2 rounded-lg">Adicionar</button>
            </form>
            <div class="border-t border-gray-800 pt-4">
                <ul id="teams-list" class="divide-y divide-gray-800"></ul>
            </div>
        </section>

        <section id="tab-questoes" class="tab-content hidden space-y-6">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="bg-gray-900 border border-gray-800 rounded-2xl p-5 shadow-xl space-y-4">
                    <h2 class="text-lg font-bold text-emerald-400">📁 Suas Coleções</h2>
                    <form id="form-add-collection" onsubmit="addCollection(event)" class="flex gap-2">
                        <input type="text" id="collection-name-input" placeholder="Nova Coleção..." required class="flex-1 text-sm bg-gray-800 border border-gray-700 rounded-lg px-3 py-1.5 text-white focus:outline-none">
                        <button type="submit" class="bg-emerald-600 text-xs text-white font-bold px-3 py-1.5 rounded-lg">Criar</button>
                    </form>
                    <div id="collections-list" class="space-y-2 max-h-64 overflow-y-auto"></div>
                </div>

                <div class="lg:col-span-2 bg-gray-900 border border-gray-800 rounded-2xl p-5 shadow-xl">
                    <h2 class="text-lg font-bold text-emerald-400 border-b border-gray-800 pb-3 mb-4">📝 Adicionar Pergunta em: <span id="selected-collection-title" class="text-white font-mono bg-gray-800 px-2 py-0.5 rounded text-sm">Nenhuma</span></h2>
                    <form id="form-add-question" onsubmit="addQuestion(event)" class="space-y-3 hidden">
                        <textarea id="q-text" rows="2" required placeholder="Pergunta..." class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-1.5 text-sm text-white focus:outline-none"></textarea>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-2">
                            <input type="text" id="q-optA" placeholder="A" required class="bg-gray-800 border border-gray-700 rounded-lg px-3 py-1.5 text-sm text-white">
                            <input type="text" id="q-optB" placeholder="B" required class="bg-gray-800 border border-gray-700 rounded-lg px-3 py-1.5 text-sm text-white">
                            <input type="text" id="q-optC" placeholder="C" required class="bg-gray-800 border border-gray-700 rounded-lg px-3 py-1.5 text-sm text-white">
                        </div>
                        <div class="flex justify-between items-end gap-4 pt-2">
                            <select id="q-correct" class="bg-gray-800 border border-emerald-800 rounded-lg px-3 py-1.5 text-sm text-white"><option value="A">A</option><option value="B">B</option><option value="C">C</option></select>
                            <button type="submit" class="bg-emerald-600 text-white font-bold px-6 py-2 rounded-lg text-sm">Salvar</button>
                        </div>
                    </form>
                    <p id="no-collection-warning" class="text-gray-500 text-sm italic text-center py-8">Selecione uma coleção ao lado.</p>
                    <div class="mt-6 border-t border-gray-800 pt-4">
                        <div id="questions-pool-list" class="space-y-2 max-h-48 overflow-y-auto"></div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        let gameData = { teams: [], collections: {}, selectedCollectionKey: null };
        let activeGame = { isRunning: false, remainingQuestions: [], currentQuestion: null, revealed: false };
        let timerInterval = null;

        // Suas perguntas reais do grupo salvos de fábrica
        const defaultCollections = {
            "Reino Fungi": [
                { text: "Os fungos são organismos que pertencem ao Reino Fungi. Uma característica típica deles é:", options: { A: "Produzir seu próprio alimento por fotossíntese.", B: "Serem heterotróficos, obtendo nutrientes de matéria orgânica.", C: "Possuírem células sem núcleo definido." }, correct: "B" },
                { text: "Qual das estruturas abaixo é responsável pela reprodução dos fungos?", options: { A: "Esporos.", B: "Cloroplastos.", C: "Raízes." }, correct: "A" },
                { text: "Ao observar um bolor ou um cogumelo, o que vemos na verdade é uma rede emaranhada de filamentos microscópicos. Qual estrutura é formada pelo conjunto dessas hifas?", options: { A: "Micélio.", B: "Basídio.", C: "Ascósporo." }, correct: "A" },
                { text: "As leveduras, como a espécie Saccharomyces cerevisiae, são muito utilizadas na fabricação de pães. O crescimento da massa acontece porque elas:", options: { A: "Produzem oxigênio durante a fotossíntese.", B: "Produzem quitina, tornando a massa mais resistente.", C: "Realizam fermentação, liberando gás carbônico (CO₂)." }, correct: "C" },
                { text: "Os líquens são considerados um exemplo de associação mutualística porque:", options: { A: "São formados pela associação entre um fungo e uma alga, em que ambos se beneficiam.", B: "São formados apenas por diferentes espécies de fungos.", C: "São uma associação entre fungos e bactérias parasitas." }, correct: "A" }
            ],
            "Protistas": [
                { text: "As zooxantelas são:", options: { A: "Fungos microscópicos que vivem sobre os corais.", B: "Algas microscópicas que vivem em simbiose com os corais, realizando fotossíntese.", C: "Bactérias que produzem a estrutura calcária." }, correct: "B" },
                { text: "A carapaça das diatomáceas é importante porque:", options: { A: "É formada por quitina.", B: "É formada por celulose.", C: "É formada por sílica e dividida em epiteca e hipoteca." }, correct: "C" },
                { text: "Uma doença causada por um protozoário do gênero Plasmodium, transmitida pela picada da fêmea do mosquito Anopheles, com febre cíclica. Qual é?", options: { A: "Doença de Chagas.", B: "Malária.", C: "Amebíase." }, correct: "B" },
                { text: "Doença causada pelo Trypanosoma cruzi, transmitida principalmente pelas fezes do barbeiro, que pode causar aumento do coração:", options: { A: "Malária.", B: "Amebíase.", C: "Doença de Chagas." }, correct: "C" },
                { text: "Protozoários desse grupo possuem um complexo apical, estrutura especializada que permite aderir e penetrar nas células do hospedeiro:", options: { A: "Amebozoários.", B: "Apicomplexos.", C: "Ciliados." }, correct: "B" }
            ]
        };

        window.onload = function() {
            if(localStorage.getItem('biomatch_v2')) {
                gameData = JSON.parse(localStorage.getItem('biomatch_v2'));
            } else {
                gameData.collections = defaultCollections;
                gameData.teams = [{ name: "Equipe Alfa", score: 0 }, { name: "Equipe Beta", score: 0 }, { name: "Equipe Gama", score: 0 }, { name: "Equipe Delta", score: 0 }];
                saveToStorage();
            }
            updateUI();
        };

        function saveToStorage() { localStorage.setItem('biomatch_v2', JSON.stringify(gameData)); }
        
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(tabId).classList.remove('hidden');
        }

        function updateUI() { renderTeamsList(); renderCollectionsList(); renderGameSelects(); renderScoreboard(); }

        function renderTeamsList() {
            document.getElementById('teams-list').innerHTML = gameData.teams.map((t, idx) => `
                <li class="flex justify-between items-center py-2"><span>${t.name}</span><button onclick="removeTeam(${idx})" class="text-xs text-red-400">Remover</button></li>
            `).join('');
        }
        function addTeam(e) { e.preventDefault(); gameData.teams.push({ name: document.getElementById('team-name-input').value, score: 0 }); document.getElementById('team-name-input').value = ''; saveToStorage(); updateUI(); }
        function removeTeam(idx) { gameData.teams.splice(idx, 1); saveToStorage(); updateUI(); }

        function renderCollectionsList() {
            document.getElementById('collections-list').innerHTML = Object.keys(gameData.collections).map(key => `
                <div onclick="selectCollection('${key}')" class="p-2 rounded bg-gray-800 cursor-pointer flex justify-between text-sm"><span>${key}</span><button onclick="deleteCollection('${key}', event)">🗑️</button></div>
            `).join('');
        }
        function addCollection(e) { e.preventDefault(); const name = document.getElementById('collection-name-input').value; gameData.collections[name] = []; saveToStorage(); updateUI(); selectCollection(name); }
        function deleteCollection(key, ev) { ev.stopPropagation(); delete gameData.collections[key]; saveToStorage(); updateUI(); selectCollection(null); }
        function selectCollection(key) { gameData.selectedCollectionKey = key; document.getElementById('selected-collection-title').innerText = key || "Nenhuma"; if(key) { document.getElementById('form-add-question').classList.remove('hidden'); document.getElementById('no-collection-warning').classList.add('hidden'); renderQuestionsPool(); } else { document.getElementById('form-add-question').classList.add('hidden'); document.getElementById('no-collection-warning').classList.remove('hidden'); } }
        function renderQuestionsPool() { document.getElementById('questions-pool-list').innerHTML = gameData.collections[gameData.selectedCollectionKey].map((q, i) => `<div class="bg-gray-800 p-2 text-xs flex justify-between"><span>${q.text}</span><button onclick="deleteQuestion(${i})" class="text-red-400">X</button></div>`).join(''); }
        function addQuestion(e) { e.preventDefault(); gameData.collections[gameData.selectedCollectionKey].push({ text: document.getElementById('q-text').value, options: { A: document.getElementById('q-optA').value, B: document.getElementById('q-optB').value, C: document.getElementById('q-optC').value }, correct: document.getElementById('q-correct').value }); saveToStorage(); renderQuestionsPool(); renderGameSelects(); }
        function deleteQuestion(idx) { gameData.collections[gameData.selectedCollectionKey].splice(idx, 1); saveToStorage(); renderQuestionsPool(); renderGameSelects(); }

        function renderGameSelects() { document.getElementById('game-collection-select').innerHTML = Object.keys(gameData.collections).map(k => `<option value="${k}">${k}</option>`).join(''); }
        
        function renderScoreboard() {
            document.getElementById('game-scoreboard').innerHTML = gameData.teams.map((t, idx) => `
                <div class="bg-gray-800 p-3 rounded-xl flex justify-between items-center">
                    <div><span class="block font-bold">${t.name}</span><span class="text-xl font-mono text-emerald-400">${t.score} pts</span></div>
                    <div class="flex flex-col gap-1"><button onclick="updateScore(${idx}, 10)" class="bg-emerald-900 text-xs p-1 rounded">+10</button><button onclick="updateScore(${idx}, -10)" class="bg-gray-900 text-xs p-1 rounded">-10</button></div>
                </div>
            `).join('');
        }
        function updateScore(idx, amt) { gameData.teams[idx].score = Math.max(0, gameData.teams[idx].score + amt); saveToStorage(); renderScoreboard(); }

        function startGame() {
            const key = document.getElementById('game-collection-select').value;
            if(!key || gameData.collections[key].length === 0) return;
            activeGame.isRunning = true; activeGame.remainingQuestions = [...gameData.collections[key]];
            document.getElementById('game-setup-screen').classList.add('hidden');
            document.getElementById('game-arena-screen').classList.remove('hidden');
            document.getElementById('game-active-collection-tag').innerText = key;
            drawQuestion();
        }
        function stopGame() { activeGame.isRunning = false; clearInterval(timerInterval); document.getElementById('game-setup-screen').classList.remove('hidden'); document.getElementById('game-arena-screen').classList.add('hidden'); }

        function drawQuestion() {
            clearInterval(timerInterval);
            resetTimerUI();
            if(activeGame.remainingQuestions.length === 0) {
                document.getElementById('game-question-text').innerText = "Fim das perguntas! 🏆";
                document.getElementById('game-options-container').innerHTML = '';
                return;
            }
            const r = Math.floor(Math.random() * activeGame.remainingQuestions.length);
            activeGame.currentQuestion = activeGame.remainingQuestions.splice(r, 1)[0];
            activeGame.revealed = false;
            document.getElementById('game-questions-counter').innerText = `Restam: ${activeGame.remainingQuestions.length + 1}`;
            document.getElementById('game-question-text').innerText = activeGame.currentQuestion.text;
            
            const opts = activeGame.currentQuestion.options;
            document.getElementById('game-options-container').innerHTML = Object.keys(opts).map(l => `
                <button id="opt-btn-${l}" class="w-full text-left bg-gray-800 p-3 rounded-xl text-sm font-medium"><span class="bg-gray-900 px-2 py-0.5 rounded mr-2">${l}</span>${opts[l]}</button>
            `).join('');
        }

        // SISTEMA DO CRONÔMETRO AUTOMÁTICO
        function startCountdown() {
            clearInterval(timerInterval);
            let timeLeft = 30;
            const timerEl = document.getElementById('game-timer');
            
            timerInterval = setInterval(() => {
                timeLeft--;
                timerEl.innerText = `${timeLeft}s`;

                if (timeLeft <= 5) {
                    timerEl.className = "text-xl font-mono font-black text-red-500 glow-red";
                } else if (timeLeft <= 15) {
                    timerEl.className = "text-xl font-mono font-black text-amber-500";
                } else {
                    timerEl.className = "text-xl font-mono font-black text-emerald-400";
                }

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    timerEl.innerText = "TEMPO ESGOTADO!";
                    revealAnswer(); // Estorou o tempo, revela a resposta automaticamente
                }
            }, 1000);
        }

        function resetTimerUI() {
            const timerEl = document.getElementById('game-timer');
            timerEl.innerText = "30s";
            timerEl.className = "text-xl font-mono font-black text-emerald-400";
        }

        function revealAnswer() {
            clearInterval(timerInterval);
            if(!activeGame.currentQuestion || activeGame.revealed) return;
            activeGame.revealed = true;
            const corr = activeGame.currentQuestion.correct;
            Object.keys(activeGame.currentQuestion.options).forEach(l => {
                const b = document.getElementById(`opt-btn-${l}`);
                if(l === corr) b.className = "w-full text-left bg-emerald-950 border border-emerald-500 p-3 rounded-xl text-emerald-300 font-bold";
                else b.className = "w-full text-left bg-gray-800 p-3 rounded-xl text-sm font-medium opacity-30";
            });
        }
    </script>
</body>
</html>
